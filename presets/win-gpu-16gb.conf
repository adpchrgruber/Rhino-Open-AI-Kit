# Preset: Windows, GPU with 16 GB VRAM (NVIDIA; AMD/Intel: BACKEND=win-vulkan)
# Qwen3.8-27B UD-IQ3_XXS, 10.9 GB. 3-bit, but a 27B model.
# Apply with setup-mac.command / setup-win.bat, or copy this file over kit.conf.

# Where setup downloads the model from (Hugging Face repo, all files Apache-2.0)
MODEL_REPO=unsloth/Qwen3.8-27B-GGUF

# Model file inside models/ (a split model names its first part; MODEL_PARTS = number of parts)
MODEL=Qwen3.8-27B-UD-IQ3_XXS.gguf
MODEL_PARTS=1

# Vision projector inside models/ (lets the model see the viewport). Empty = off.
# To turn it on: MMPROJ=Qwen3.8-27B-mmproj-F16.gguf and run setup again (choose "keep").
MMPROJ=
# File name of the projector in the Hugging Face repo
MMPROJ_FILE=mmproj-F16.gguf

# Context window in tokens
CTX=8192

# Model layers on the GPU: 99 = all (Apple Silicon, enough VRAM), 0 = CPU only
NGL=99

# llama.cpp build for setup to download: mac-arm64, mac-x64, win-cuda, win-vulkan, win-cpu
BACKEND=win-cuda

# Local port of the model server (only reachable from this computer)
PORT=8080

# 1 = let the model "think" before answering (better for spatial tasks, slower), 0 = off
THINKING=0

# 1 = show generated Python and ask before running it in Rhino. Keep this on.
CONFIRM_CODE=1

# Sampling temperature
TEMPERATURE=0.4
